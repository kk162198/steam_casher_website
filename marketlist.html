<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam 加值幫手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans m-0 p-0">
    <nav id = "nav" class="bg-slate-800 border-b border-slate-700 sticky top-0 w-100% z-50"></nav>

    <div class="w-[1700px] mx-auto px-6 pt-6 pb-12 space-y-6">
        
        <div class="grid grid-cols-3 items-center w-full py-2">
            <div></div>
            <div class="flex justify-center items-center">
                <h1 class="text-2xl font-bold tracking-wide text-slate-300 mx-4">市場列表</h1>
            </div>
            <div class="flex justify-end items-center space-x-3">
                <span id="connection-badge" class="px-2 py-1 rounded text-xs bg-red-500 text-white font-semibold">未連線</span>
                <button id="refresh-btn" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold px-4 py-2 rounded shadow transition-all active:scale-95 text-sm">
                    刷新數據
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 shadow-md">
                <div class="text-xs font-medium text-slate-400">當前最佳</div>
                <div id="max-roi" class="text-2xl font-bold text-emerald-400 mt-1">-- %</div>
            </div>
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 shadow-md">
                <div class="text-xs font-medium text-slate-400">已監控武器箱總數</div>
                <div id="monitored-count" class="text-2xl font-bold text-cyan-400 mt-1">--</div>
            </div>
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 shadow-md">
                <div class="text-xs font-medium text-slate-400">上次更新時間</div>
                <div id="last-update" class="text-2xl font-bold text-slate-300 mt-1">--</div>
            </div>
        </div>

        <div class="bg-slate-800 rounded-lg border border-slate-700 shadow-lg overflow-hidden">
            <div class="px-4 py-3 bg-slate-700 text-sm font-semibold tracking-wide flex justify-between items-center">
                <span>即時市場價差與套利空間監控</span>
                <span class="text-xs text-slate-400">※ 依利潤倍數由高至低排序</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-700 bg-slate-800/50 text-slate-400 text-xs uppercase font-mono">
                            <th class="p-4">武器箱名稱 (Item Name)</th>
                            <th class="p-4">Steam 售價 (Price)</th>
                            <th class="p-4">CSFloat 成本 (Cost)</th>
                            <th class="p-4">價差淨利 (Net Profit)</th>
                            <th class="p-4">預估套利投報率 (ROI)</th>
                            <th class="p-4">Steam 資料更新時間</th>
                            <th class="p-4">CSFloat 資料更新時間</th>
                        </tr>
                    </thead>
                    <tbody id="case-table-body" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-slate-500 font-mono">
                                點擊「從 Supabase 讀取數據」按鈕開始連線...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="bg-slate-800 rounded-lg border border-slate-700 shadow-lg overflow-hidden">
            <div class="bg-slate-700 px-4 py-2 text-xs font-mono text-slate-400">
                Supabase Realtime API Response Log
            </div>
            <div id="log-console" class="p-3 font-mono text-xs text-slate-300 space-y-1 max-h-32 overflow-y-auto bg-slate-950">
                <div>[System] 前端操盤面板已就緒，Supabase Client 已載入。</div>
            </div>
        </div>

    </div>
    <footer id = footer class="bg-slate-950 border-t border-slate-800 text-slate-400 py-8 px-6 mt-12 button-0"></footer>

    <script>
        // 1. 宣告金鑰
        const supabaseUrl = 'https://ayizsqevbabaxnapgwua.supabase.co';
        const supabaseKey = 'sb_publishable_qaDGPbpdQVbWj9GcyWRB6A_MmqFAQa1'; 
        
        const CLIENT = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. 抓取網頁上的 DOM 節點
        const refreshBtn = document.getElementById('refresh-btn');
        const caseTableBody = document.getElementById('case-table-body');
        const maxRoiDisplay = document.getElementById('max-roi');
        const monitoredCountDisplay = document.getElementById('monitored-count');
        const lastUpdateDisplay = document.getElementById('last-update');
        const connectionBadge = document.getElementById('connection-badge');
        const logConsole = document.getElementById('log-console');
        const loadingText = document.getElementById('loading-text');
        function loadNav(pageID) {
            fetch("nav.html")
                .then(response => {
                    if (!response.ok)throw new Error("網路回應不成功");
                    return response.text()
                })
                .then(html_text => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html_text,"text/html");
                    const high_light = doc.getElementById(`nav-${pageID}`);
                    if (high_light) {
                        high_light.classList.remove('text-slate-300', 'hover:text-cyan-400');
                        high_light.classList.add('text-cyan-400', 'bg-slate-900/50');
                    }
                document.getElementById('nav').innerHTML = doc.body.innerHTML;
                }
                )
        }
        function loadFooter() {
            fetch("footer.html")
                .then(response => {
                    if (!response.ok)throw new Error("網路回應不成功");
                    return response.text()
                })
                .then(html_text => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html_text,"text/html");
                    document.getElementById('footer').innerHTML = doc.body.innerHTML;
                }
                )
        }
        // 日誌輔助函式
        function addLog(message) {
            const time = new Date().toLocaleTimeString();
            const logItem = document.createElement('div');
            logItem.innerHTML = `<span class="text-slate-500">[${time}]</span> ${message}`;
            logConsole.appendChild(logItem);
            logConsole.scrollTop = logConsole.scrollHeight;
        }

        // 3. 從 Supabase 資料庫抓取數據的函式
        async function fetchFromSupabase() {
            if (loadingText) loadingText.innerText = "正在呼叫 Supabase RESTful API 撈取市場套利數據...";
            addLog('<span class="text-cyan-400">正在呼叫 Supabase RESTful API 撈取市場套利數據...</span>');
            refreshBtn.disabled = true;
            
            // 💡 關鍵修正：把 rate 的宣告提到最外面，讓下面的 forEach 迴圈能夠順利讀取它
            let rate = 32.5; 

            try {
                // 🚀 1. 向國際匯率 API 發送請求
                try {
                    const response = await fetch('https://open.er-api.com/v6/latest/USD');
                    const data = await response.json();
                    rate = data.rates.TWD;
                    console.log(`當前美金對台幣匯率: ${rate}`);
                } catch (error) {
                    console.log(`匯率抓取失敗，使用預設值 32.5: ${error}`);
                    rate = 32.5;
                }

                // 🚀 2. 改用 CLIENT 去要資料
                // 💡 修正：加上 nullsFirst: false，避免 ratio 尚未算出的 null 資料在 desc 排序時被排到最前面
                const { data, error } = await CLIENT
                    .from('cases_data')
                    .select('*')
                    .order('ratio', { ascending: false, nullsFirst: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    addLog('<span class="text-amber-400">連線成功，但目前 cases_data 表中沒有任何數據。</span>');
                    caseTableBody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-amber-400 font-mono">資料庫目前空空如也</td></tr>`;
                    return;
                }

                const totalItems = data.length;

                // 💡 修正：從「第一筆有效 ratio」的資料換算最高 ROI，避免 null 資料把最佳 ROI 誤算成 0%
                const firstValidRow = data.find(item => item.ratio !== null && item.ratio !== undefined);
                const maxRoi = firstValidRow ? (Number(firstValidRow.ratio) - 1) * 100 : 0;

                // 更新頂部 KPI 卡片
                maxRoiDisplay.innerText = `${maxRoi.toFixed(2)} %`;
                monitoredCountDisplay.innerText = totalItems;
                lastUpdateDisplay.innerText = new Date().toLocaleTimeString();

                // 更新連線狀態燈號
                connectionBadge.innerText = "已連線";
                connectionBadge.className = "px-2 py-1 rounded text-xs bg-emerald-500 text-slate-950 font-bold";

                // 清空並渲染表格
                caseTableBody.innerHTML = '';
                data.forEach(item => {
                    const roiPercentage = (Number(item.ratio) - 1) * 100; // 比率(1.39) 轉成 百分比(39%)
                    
                    // 💡 關鍵修正：改乘以最外層的 rate 變數，並精準對齊 Supabase 欄位名稱 csfloat_price
                    const netProfit = Number(item.diff || 0) * rate; 
                    const steamPrice = Number(item.steam_price || 0) * rate; 
                    const csfloatCost = Number(item.csfloat_price || 0) * rate; 

                    const steamTime = item.steam_updated_at ? new Date(item.steam_updated_at).toLocaleTimeString('zh-TW', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '--';
                    const csfloatTime = item.csfloat_updated_at ? new Date(item.csfloat_updated_at).toLocaleTimeString('zh-TW', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '--';

                    // 判斷文字顏色
                    const roiClass = roiPercentage > 0 ? 'text-emerald-400 font-bold' : 'text-red-400';
                    const profitClass = netProfit > 0 ? 'text-emerald-500' : 'text-red-500';
                    
                    const row = document.createElement('tr');
                    row.className = "border-b border-slate-700/40 hover:bg-slate-700/30 transition-colors";
                    
                    // 💡 視覺優化：加上 NT$ 前綴，並在最後渲染時才使用 .toFixed(0) 轉整數
                    row.innerHTML = `
                        <td class="p-4 font-medium text-slate-200">${item.name}</td>
                        <td class="p-4 font-mono">NT$ ${steamPrice.toFixed(0)}</td>
                        <td class="p-4 font-mono">NT$ ${csfloatCost.toFixed(0)}</td>
                        <td class="p-4 font-mono ${profitClass}">NT$ ${netProfit.toFixed(0)}</td>
                        <td class="p-4 font-mono ${roiClass}">${roiPercentage > 0 ? '+' : ''}${roiPercentage.toFixed(2)}%</td>
                        <td class="p-4 font-mono text-xs text-slate-400">${steamTime}</td>
                        <td class="p-4 font-mono text-xs text-slate-400">${csfloatTime}</td>
                    `;
                    caseTableBody.appendChild(row);
                });

                addLog(`<span class="text-emerald-400 font-semibold">成功從 Supabase 同步 ${totalItems} 筆武器箱套利數據！</span>`);

            } catch (error) {
                addLog(`<span class="text-red-400">Supabase 讀取失敗: ${error.message}</span>`);
                console.error(error);
            } finally {
                refreshBtn.disabled = false;
                if (loadingText) loadingText.innerText = "點擊「讀取數據」按鈕開始連線...";
            }
        }
        loadNav("marketlist")
        loadFooter()
        fetchFromSupabase()
        // 綁定事件
        refreshBtn.addEventListener('click', fetchFromSupabase);
    </script>
</body>
</html>
