<div id="nav-root">
<style>
/* nav.html 自帶樣式：透過 fetch + innerHTML 插入時 <style> 會生效，<script> 不會，
   所以互動一律用 inline onclick。容器 <nav id="nav"> 的舊底色在這裡覆蓋。
   這個 <style> 必須包在 #nav-root 裡：DOMParser 會把檔首的 <style> 收進 doc.head，
   而載入器只取 doc.body.innerHTML，放在最外層會整包被丟掉。 */
nav#nav{background:#0f172a;border-bottom:1px solid #1e293b}
#nav a,#nav button{font-family:inherit}
#nav a:focus-visible,#nav button:focus-visible{outline:2px solid #22d3ee;outline-offset:2px;border-radius:6px}
/* ⚠️ 左右 padding 從 16 縮到 12（2026-08-24）：桌機清單多了第 7 顆「清單」，
   維持 16px 的話在 768px（md 斷點最窄處）會擠出橫向溢出。縮 4px 之後
   7 顆的總寬與原本 6 顆幾乎一樣（416 vs 404px）。
   ⚠️ min-height 44px 是觸控尺寸，不可以跟著縮。 */
#nav .nav-link{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:6px;font-size:16px;line-height:1.4}
#nav .nav-link:hover{background:rgba(30,41,59,.6)}

/* 資料狀態指示點：頁面自行設定 data-state="fresh|aging|stale" 與內文
   例：var s=document.getElementById('data-status'); s.dataset.state='fresh';
       s.querySelector('.ds-text').textContent='資料 12 分鐘前更新'; */
#data-status{display:flex;align-items:center;gap:7px;min-height:44px;padding:0 12px;border-radius:999px;
  border:1px solid #1e293b;font-size:12px;line-height:1.4;color:#94a3b8;white-space:nowrap;
  font-variant-numeric:tabular-nums;text-decoration:none}
#data-status:hover{background:rgba(30,41,59,.6);text-decoration:none}
#data-status .ds-dot{width:7px;height:7px;border-radius:999px;background:#64748b;flex:none}
#data-status .ds-icon{display:none}
#data-status[data-state="fresh"]{color:#94a3b8}
#data-status[data-state="fresh"] .ds-dot{background:#34d399}
#data-status[data-state="aging"]{color:#fbbf24;border-color:rgba(251,191,36,.4)}
#data-status[data-state="aging"] .ds-dot{background:#fbbf24}
#data-status[data-state="stale"]{color:#fb7185;border-color:rgba(251,113,133,.45)}
#data-status[data-state="stale"] .ds-dot{display:none}
#data-status[data-state="stale"] .ds-icon{display:block}

/* 品牌名走設計系統的 .t-sub（18 / 17px），只補回 logo 該有的字重。
   不可斷行：390px 寬時會被擠成「Steam 加值幫／手」。 */
#nav .brand{flex:none}
#nav .brand-name{white-space:nowrap;font-weight:700}
#nav-mobile .m-brand{font-weight:700}
@media (max-width:400px){
  #data-status{padding:0 10px;gap:5px}
}
/* 320px（iPhone SE 一代、摺疊機外螢幕）排不下品牌名＋狀態膠囊＋漢堡鈕。
   膠囊只留指示點：顏色仍代表資料新舊，點下去一樣進 transparency.html。 */
@media (max-width:379px){
  #data-status{padding:0;width:44px;justify-content:center;border-color:transparent}
  #data-status .ds-text{display:none}
}

#nav-mobile{display:none}
#nav-mobile.is-open{display:flex}
#nav-mobile .m-link{display:flex;align-items:center;min-height:52px;font-size:20px;font-weight:700;
  line-height:1.4;color:#f1f5f9;text-decoration:none}
#nav-mobile .m-link:hover{color:#22d3ee;text-decoration:none}
#nav-mobile .m-sub{display:flex;align-items:center;min-height:44px;font-size:16px;color:#94a3b8;text-decoration:none}
#nav-mobile .m-sub:hover{color:#22d3ee;text-decoration:none}
</style>
