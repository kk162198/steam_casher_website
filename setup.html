<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初始設定已併入操作指南｜Steam 加值幫手</title>

    <!-- ⚠️ 2026-08-24：初始設定併進 help.html 的「只做一次」那一段。
         這個檔案留著只為了一件事：**舊網址不要 404。**

         GitHub Pages 是純靜態，發不出 301，所以用 meta refresh + JS 轉址，
         並把 canonical 指向 help.html，讓搜尋引擎把權重歸給那一頁。

         ⚠️ 用 location.replace() 不是 location.href：replace 不會在瀏覽紀錄裡
            留下這一頁，否則使用者在 help.html 按上一頁會被彈回來又轉走，
            變成按不出去。
         ⚠️ 不要加 <script src="assets/site.js">：那會多抓 nav.html 與 footer.html
            兩個片段，只為了一個馬上就要離開的頁面。 -->
    <meta http-equiv="refresh" content="0; url=help.html">
    <link rel="canonical" href="https://kk162198.github.io/steam_casher_website/help.html">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/utilities.css">
    <link rel="stylesheet" href="assets/style.css">
    <script>location.replace('help.html' + location.hash);</script>
</head>
<body data-page="help">
    <main class="wrap" style="padding-top:64px;max-width:640px">
        <div class="card">
            <h1 class="t-sect">初始設定已經併進操作指南</h1>
            <p class="t-body c-ink2 flow-sm">
                那五件「只做一次」的事現在在操作指南的上半頁，勾選紀錄沿用同一份，不用重勾。
            </p>
            <div class="flow-lg">
                <a href="help.html" class="btn btn-primary">前往操作指南</a>
            </div>
        </div>
    </main>
</body>
</html>
